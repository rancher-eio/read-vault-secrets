---
name: Read Vault Secrets
description: "... it reads secrets from Vault?"
inputs:
  address:
    description: "the address of a deployed vault server"
    required: false
    default: https://vault.rancher.engineering
  secrets:
    description: "the secrets to fetch from the vault server"
    required: false
    default: secret/data/github-actions/test status
  role:
    description: "the Vault role to log in with (default: github.event.repository.name)"
    required: false
    default: ${{ github.event.repository.name }}
runs:
  using: composite
  steps:
    - name: Check the Vault role
      if: inputs.role == ''
      shell: bash
      run: |
        echo "::error::The role input is empty. The event of some triggers, for example schedule, has no repository object. Set the role input to the name of the repository without the owner."
        exit 1
    - name: Read Secrets from Vault"
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      id: vault
      with:
        method: jwt
        url: ${{ inputs.address }}
        path: ${{ github.repository_owner }}
        role: ${{ inputs.role }}
        secrets: ${{ inputs.secrets }}
        exportEnv: true
